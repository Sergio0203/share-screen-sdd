# Implantação com mídia pelo servidor (T10): app + servidor de mídia (LiveKit) + Caddy (HTTPS e
# porta 443 compartilhada). Valores em .env (veja .env.exemplo). Detalhes no README, "Implantação".
services:
  caddy:
    image: livekit/caddyl4:latest
    restart: unless-stopped
    command: run --config /etc/caddy/Caddyfile --adapter caddyfile
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO no .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-dados:/data
    depends_on:
      - app
      - livekit

  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?defina LIVEKIT_API_KEY no .env}: ${LIVEKIT_API_SECRET:?defina LIVEKIT_API_SECRET no .env}"
      LIVEKIT_WEBHOOK_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_TURN_DOMAIN: turn.${DOMINIO}
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  app:
    image: ghcr.io/sergio0203/share-screen-sdd:latest
    restart: unless-stopped
    environment:
      LIVEKIT_URL: wss://${DOMINIO}
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}

volumes:
  caddy-dados:
