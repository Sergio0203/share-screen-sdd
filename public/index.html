<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0b0d" />
    <title>Telão</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23dc2626'/%3E%3Cstop offset='1' stop-color='%237f1d1d'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='1' y='2' width='22' height='16' rx='4' fill='url(%23g)'/%3E%3Cpath d='M10 7.5v5l4.5-2.5z' fill='%23fff'/%3E%3Cpath d='M8 22h8M12 18v4' stroke='%23dc2626' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/estilos.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <header class="cabecalho">
      <!-- Logo do Telão (T09 FR-018): um telão com um "play", no traço dos ícones. -->
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="degrade-logo" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#dc2626" />
            <stop offset="1" stop-color="#7f1d1d" />
          </linearGradient>
        </defs>
        <rect x="1" y="2" width="22" height="16" rx="4" fill="url(#degrade-logo)" />
        <path d="M10 7.5v5l4.5-2.5z" fill="#fff" />
        <path
          d="M8 22h8M12 18v4"
          stroke="#dc2626"
          stroke-width="2"
          stroke-linecap="round"
          fill="none"
        />
      </svg>
      <span class="marca">Telão</span>
    </header>
    <main id="tela-inicio" hidden></main>
    <main id="tela-sala" hidden></main>
    <p id="mensagem" role="status" aria-live="polite"></p>
  </body>
</html>
